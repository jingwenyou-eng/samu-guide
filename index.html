<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SAM'U 產品導覽：回答兩個問題，找到適合你的保養品與使用順序。">
<title>SAM'U 產品導覽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one centered quiz card (Q1 what → Q2 concern → results), then a KOL picks band, then a slide-in product sheet */
:root{
  --bg:#fbf1f2; --card:#ffffff; --ink:#2e1519; --sub:#8b6b71; --line:#f0dce0; --tile:#fdf6f7;
  --rose:#c4203d; --rose-soft:#fbe2e7; --lav:#7c1328; --stem:#5d7a3b; --stem-soft:#e7eedb;
  --title:"Shippori Mincho","Noto Serif TC",serif;
  --cherry:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M34%208C30%2018%2025%2027%2021%2035M34%208C38%2019%2041%2029%2042%2037M34%208C40%202%2051%202%2056%208C50%2013%2040%2013%2034%208ZM37%208L52%207.5%27%2F%3E%3Ccircle%20cx%3D%2720%27%20cy%3D%2746%27%20r%3D%2711%27%2F%3E%3Ccircle%20cx%3D%2742%27%20cy%3D%2748%27%20r%3D%2711%27%2F%3E%3Cpath%20d%3D%27M14%2043a7%207%200%200%201%204.5-4.5M36%2045a7%207%200%200%201%204.5-4.5%27%2F%3E%3C%2Fsvg%3E");
  --latin:"Outfit","Futura",sans-serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0e11;--card:#251519;--ink:#f7e9ec;--sub:#c2a3a9;--line:#43262d;--tile:#2e1b20;--rose:#f0708a;--rose-soft:#4a1f2a;--lav:#a8304b;--stem:#a3c27f;--stem-soft:#27311d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a0e11;--card:#251519;--ink:#f7e9ec;--sub:#c2a3a9;--line:#43262d;--tile:#2e1b20;--rose:#f0708a;--rose-soft:#4a1f2a;--lav:#a8304b;--stem:#a3c27f;--stem-soft:#27311d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:22px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand b{font-family:var(--latin);font-weight:500;font-size:20px;letter-spacing:.06em}
.brand span{font-family:var(--latin);font-size:11px;letter-spacing:.22em;color:var(--sub)}
.quiz{background:var(--card);border-radius:24px;padding:28px clamp(18px,4vw,36px) 30px;display:grid;gap:22px;box-shadow:0 10px 30px rgb(140 20 45 / .07)}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--latin);font-size:12px;letter-spacing:.12em;color:var(--sub)}
.bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:4px;transition:width .35s ease}
.q{display:grid;gap:6px}
.q small{font-family:var(--latin);font-weight:600;color:var(--rose);letter-spacing:.14em;font-size:12px}
.q h1,.q h2{margin:0;font-size:clamp(22px,4.6vw,28px);font-weight:700;line-height:1.35;text-wrap:balance}
.q p{margin:0;color:var(--sub);font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--tile);border:1.5px solid transparent;border-radius:16px;padding:14px 16px;display:grid;gap:2px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--rose);transform:translateY(-1px)}
.opt b{font-weight:500;font-size:15.5px}
.opt span{font-size:12.5px;color:var(--sub)}
.opt.wide{grid-column:1/-1;background:transparent;border:1.5px dashed var(--line);text-align:center}
.opt.wide:hover{border-color:var(--rose)}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{all:unset;cursor:pointer;font-size:13.5px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 12px;border-radius:999px;background:var(--rose-soft);color:var(--rose)}
.list{display:grid;gap:10px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:10px;border-radius:16px;background:var(--tile);border:1.5px solid transparent;transition:border-color .15s}
.item:hover{border-color:var(--line)}
.sw{width:60px;height:60px;border-radius:12px;background:linear-gradient(150deg,var(--t1),var(--t2));display:grid;place-items:center;font-family:var(--latin);font-size:10px;letter-spacing:.08em;color:#4a4352;text-align:center;line-height:1.2;padding:4px}
.item .txt{min-width:0;display:grid;gap:1px}
.item .s{font-size:12px;color:var(--sub)}
.item b{font-weight:500;font-size:15px;line-height:1.4}
.item .d{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{font-family:var(--latin);font-size:12px;color:var(--sub);white-space:nowrap}
.badge{display:inline-block;margin-left:6px;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--rose);color:#fff;vertical-align:2px;font-weight:500}
.note{font-size:13px;color:var(--sub);margin:0}
.kol{background:linear-gradient(135deg,var(--rose-soft),var(--card) 70%);border-radius:24px;padding:26px clamp(18px,4vw,32px);display:grid;gap:18px;border:1px solid var(--line)}
.kh{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e8546f,#7c1328);display:grid;place-items:center;color:#fff;font-family:var(--latin);font-weight:600;font-size:22px;flex:none}
.kh .who{flex:1;min-width:160px;display:grid}
.kh .who small{font-family:var(--latin);letter-spacing:.16em;font-size:11px;color:var(--rose);font-weight:600}
.kh .who b{font-size:20px;font-weight:700}
.kh .who span{font-size:13px;color:var(--sub)}
.ig{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500}
.ig:hover{opacity:.88}
.ig svg{width:16px;height:16px}
.kol blockquote{margin:0;font-size:14.5px;line-height:1.7;padding-left:14px;border-left:2px solid var(--rose)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pick{background:var(--card);border-radius:16px;padding:12px;display:grid;gap:8px;align-content:start;border:1px solid var(--line)}
.sw{position:relative;overflow:hidden}
.sw.has-img{background:#fff;padding:0}
.sw.has-img .sw-t{visibility:hidden}
.sw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.sheet .sw.has-img{aspect-ratio:4/3;max-height:42vh;width:auto;justify-self:center}
.pick .sw{width:100%;height:auto;aspect-ratio:4/3;max-width:100%;font-size:11px}
.pick button{all:unset;cursor:pointer;font-weight:500;font-size:14px;line-height:1.4}
.pick a{font-size:12.5px;color:var(--rose);text-decoration:none}
.pick a:hover{text-decoration:underline}
.opt:focus-visible,.item:focus-visible,.link:focus-visible,.ig:focus-visible,.pick button:focus-visible,.close:focus-visible,.rel button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.scrim{position:fixed;inset:0;background:rgb(45 10 18 / .35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;max-width:640px;margin:0 auto;background:var(--card);z-index:21;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.close{all:unset;cursor:pointer;justify-self:end;font-size:13px;color:var(--sub);padding:4px 12px;border:1px solid var(--line);border-radius:999px}
.sheet .sw{width:100%;height:auto;aspect-ratio:16/7;max-width:100%;font-size:13px;border-radius:16px}
.sheet h3{margin:0;font-size:21px;line-height:1.4}
.sheet .s{font-size:13px;color:var(--sub)}
.sheet p{margin:0}
.sheet dl{display:grid;grid-template-columns:5em 1fr;gap:8px 12px;margin:0;font-size:14px;border-top:1px solid var(--line);padding-top:14px}
.sheet dt{color:var(--sub)}.sheet dd{margin:0}
.rel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
.rel button{all:unset;cursor:pointer;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--tile);color:var(--ink)}
/* cherry line art */
.ch{display:inline-block;width:22px;height:22px;background:var(--rose);-webkit-mask:var(--cherry) center/contain no-repeat;mask:var(--cherry) center/contain no-repeat;vertical-align:-4px;margin-right:6px}
.quiz,.kol{position:relative;overflow:hidden}
.quiz::before,.kol::before{content:"";position:absolute;width:140px;height:140px;background:var(--rose);opacity:.09;-webkit-mask:var(--cherry) center/contain no-repeat;mask:var(--cherry) center/contain no-repeat;pointer-events:none}
.quiz::before{right:-18px;top:-22px;transform:rotate(14deg)}
.kol::before{right:10px;bottom:-30px;transform:rotate(-10deg)}
.quiz>*,.kol>*{position:relative}
.q small::before{content:"";display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;background:var(--rose);-webkit-mask:var(--cherry) center/contain no-repeat;mask:var(--cherry) center/contain no-repeat}
footer::before{content:"";display:block;height:18px;margin-bottom:12px;background:radial-gradient(circle,var(--rose) 1.2px,transparent 1.6px) 0 50%/14px 14px repeat-x;opacity:.35}
/* KOL stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.story{all:unset;cursor:pointer;display:grid;justify-items:center;gap:6px;width:76px;flex:none;text-align:center}
.story .ring{width:66px;height:66px;border-radius:50%;padding:3px;background:var(--line);display:block;transition:background .2s}
.story .ring>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--rose-soft);border:3px solid var(--card)}
.story .ring .ch{width:28px;height:28px;margin:0;vertical-align:0}
.story[aria-selected="true"] .ring{background:linear-gradient(135deg,#f6a9b8,var(--rose) 55%,var(--lav))}
.story small{font-size:12px;line-height:1.35;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story[aria-selected="true"] small{color:var(--ink);font-weight:500}
.story:focus-visible .ring{outline:2px solid var(--rose);outline-offset:2px}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.th b{font-family:var(--title);font-size:17px}
.th a{font-size:13px;color:var(--rose);text-decoration:none}
.th a:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tagb{all:unset;cursor:pointer;font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);transition:all .15s}
.tagb::before{content:"# ";color:var(--rose)}
.tagb:hover{border-color:var(--rose)}
.tagb[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.tagb[aria-pressed="true"]::before{color:#fff}
.tagb:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.kp{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kp .sw{width:96px;height:96px;font-size:10px}
.kp-t{display:grid;gap:4px;min-width:0}
.kp-t .s{font-size:12px;color:var(--sub)}
.kp-t b{font-size:16px;font-weight:600;line-height:1.4}
.kp-t p{margin:0;font-size:13.5px}
.kp-t p.how{color:var(--sub);font-size:13px}
.kp-act{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
.buy{display:inline-flex;align-items:center;background:var(--rose);color:#fff;font-size:14px;font-weight:500;padding:9px 18px;border-radius:999px;text-decoration:none}
.buy:hover{background:var(--lav)}
.buy.off{background:var(--tile);color:var(--sub);border:1px dashed var(--line);cursor:default}
.buy:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.kt{display:grid;grid-template-columns:1.1fr 1.4fr 1fr auto;gap:8px;align-items:end;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.kt label{display:grid;gap:4px;font-size:12px;color:var(--sub);min-width:0}
.kt input,.bl input{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.kt2{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--tile)}
.kt2h{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.kt2h label{flex:1;min-width:160px}
.kt2 label{display:grid;gap:4px;font-size:12px;color:var(--sub);min-width:0}
.kt2 input,.kt2 textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.kt2 textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;resize:vertical;white-space:pre;overflow-x:auto}
.th span{font-size:12.5px;color:var(--sub)}
.vid{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--card);font-size:14px;font-weight:500;padding:9px 16px;border-radius:999px;text-decoration:none}
.vid:hover{opacity:.88}
.vid svg{width:14px;height:14px}
.vid:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.kp.kp-v{grid-template-columns:1fr}
.kp-t .alias{font-size:12px;color:var(--rose)}
.bl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 12px;align-items:center;font-size:13px}
@media (max-width:640px){.kt{grid-template-columns:1fr 1fr}.kt .full2{grid-column:1/-1}.bl{grid-template-columns:1fr}}
@media (max-width:480px){.kp{grid-template-columns:64px minmax(0,1fr)}.kp .sw{width:64px;height:64px}}
/* scroll hint */
.more{all:unset;cursor:pointer;justify-self:center;display:grid;justify-items:center;gap:0;font-size:12.5px;color:var(--sub);letter-spacing:.04em;margin-block:-8px;padding:4px 12px;border-radius:999px;text-align:center}
.more:hover{color:var(--rose)}
.more svg{width:20px;height:20px;color:var(--rose);animation:nudge 1.6s ease-in-out infinite}
.more:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.more svg{animation:none}}
/* tap hints & multi-select */
.tap{margin:0 0 -8px;font-size:12px;color:var(--rose);letter-spacing:.04em}
.tapx{display:block;font-style:normal;font-size:11.5px;color:var(--rose);margin-top:2px;font-family:var(--body);white-space:nowrap}
.opt.multi{position:relative;padding-right:40px}
.opt .ck{position:absolute;top:14px;right:14px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--card)}
.opt.multi[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft)}
.opt.multi[aria-pressed="true"] .ck{background:var(--rose);border-color:var(--rose)}
.opt.multi[aria-pressed="true"] .ck::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.go-res{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;background:var(--rose);color:#fff;font-weight:600;font-size:15px;padding:13px 20px;border-radius:999px}
.go-res:hover{background:var(--lav)}
.go-res:disabled{cursor:default;background:var(--tile);color:var(--sub);border:1px dashed var(--line)}
.go-res:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
/* product editor */
.pr-top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pr-top input{flex:1;min-width:180px;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pr-list{display:grid;gap:6px;max-height:520px;overflow-y:auto;padding-right:4px}
.pr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pr-id{font-family:var(--latin);font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.pr-n{display:grid;font-size:13.5px;min-width:0}
.pr-n small{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-b{display:flex;gap:6px}
.pr-b .btn2{padding:4px 10px;font-size:12px}
.pf{display:grid;gap:10px;padding:14px;border:1.5px solid var(--rose);border-radius:12px;background:var(--card);margin:4px 0 8px}
.pf-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.pf label{display:grid;gap:4px;font-size:12px;color:var(--sub);min-width:0}
.pf input:not([type=checkbox]),.pf textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.pf-cats{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--sub)}
.pf-cats>span{width:100%}
.pf .pf-ck{display:inline-flex;grid-template-columns:none;align-items:center;gap:5px;font-size:13px;color:var(--ink)}
.pf-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.pf-g{grid-template-columns:1fr}.pr{grid-template-columns:1fr}.pr-b{justify-content:flex-start}}
.pf-up{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pf-prev{width:84px;height:84px;border-radius:12px;border:1px dashed var(--line);background:#fff;display:grid;place-items:center;font-size:11.5px;color:#8b6b71;overflow:hidden;flex:none}
.pf-prev img{width:100%;height:100%;object-fit:contain}
.pf-up-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;min-width:0}
.pf-up-r .sub{font-size:12px;color:var(--sub);width:100%}
.pf .pf-file{display:inline-flex;position:relative;overflow:hidden;color:var(--ink)}
.pf-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pf-file:focus-within{outline:2px solid var(--rose);outline-offset:2px}
.pr{grid-template-columns:40px auto minmax(0,1fr) auto}
.pr-th{width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden}
.pr-th img{width:100%;height:100%;object-fit:contain}
@media (max-width:560px){.pr{grid-template-columns:40px minmax(0,1fr)}.pr-id{display:none}.pr-b{grid-column:1/-1}}
.kt2 .drag{cursor:grab;user-select:none;font-size:18px;line-height:1;color:var(--sub);padding:8px 4px;align-self:center;letter-spacing:-3px}
.kt2 .drag:active{cursor:grabbing}
.kt2 .tmv{display:flex;gap:4px;align-self:center}
.kt2 .tmv .btn2{padding:4px 9px;font-size:12px}
.kt2 .tmv .btn2:disabled{opacity:.35;cursor:default}
.kt2.dragging{opacity:.45}
.kt2.over-b{box-shadow:0 -3px 0 var(--rose)}
.kt2.over-a{box-shadow:0 3px 0 var(--rose)}
.rte{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.rte-h{font-family:var(--title);font-size:14.5px;margin-top:6px}

     ${st.cat!=="any"?`<button class="opt wide" data-con="none"><b>沒有特別，全部都看看</b></button>`:""}</div>

     <div class="nav"><button class="link" data-go="back">← 上一題</button><span></span></div>`;
  }else{
    const cat=CATS.find(c=>c.k===st.cat), cons=CONCERNS.filter(c=>st.cons.includes(c.k)), conSeries=[...new Set(cons.flatMap(c=>c.series))], conNames=cons.map(c=>c.name).join("、");
    const okCat=p=>!cat||p.cats.some(x=>cat.cats.includes(x));

    list.sort((a,b)=>(picked.has(b.id)-picked.has(a.id))||rank(a)-rank(b)||a.id-b.id);
    const tags=[cat&&cat.name,...cons.map(c=>c.name)].filter(Boolean);
    q.innerHTML=bar(3)+`<div class="q"><small>YOUR MATCH</small><h2>${tags.length?"為你找到 "+list.length+" 項產品":"全部產品・"+list.length+" 項"}</h2>
      ${tags.length?`<div class="chips">${tags.map(t=>`<span class="chip">${t}</span>`).join("")}</div>`:""}</div>
      ${tags.length?routineHTML(cons):""}
      ${tags.length?`<h3 class="rt-h">${cat?cat.name+"類":"其他"}符合的產品</h3>`:""}
      ${fallback?`<p class="note">這個類別裡沒有專攻「${conNames}」的品項，先列出全部${cat.name}產品給你參考。</p>`:""}

function pickFor(stepCat,seriesList,used){
  const ok=p=>!(used&&used.has(p.id));
  const score=p=>[picked.has(p.id)?0:1,p.cats[0]===stepCat?0:1,seriesList.indexOf(p.s),p.id];
  const cmp=(a,b)=>{const x=score(a),y=score(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0};
  let c=P.filter(p=>ok(p)&&p.cats.includes(stepCat)&&seriesList.includes(p.s));
  if(c.length)return {p:c.sort(cmp)[0],fb:false};
  const base=["ph","sen","pan"];
  c=P.filter(p=>ok(p)&&p.cats.includes(stepCat)&&base.includes(p.s)).sort((a,b)=>base.indexOf(a.s)-base.indexOf(b.s)||(a.cats[0]===stepCat?0:1)-(b.cats[0]===stepCat?0:1)||a.id-b.id);
  return c.length?{p:c[0],fb:true}:null;
}
function routineHTML(cons){
  const series=cons.length?[...new Set(cons.flatMap(c=>c.series))]:["ph"];
  const keys=cons.length?cons.map(c=>c.k):["none"];
  const fixed=sid=>{for(const k of keys){const id=(RT.pick[k]||{})[sid];const p=id&&P.find(x=>x.id===id);if(p)return {p,fb:false}}return null};
  const steps=RT.steps.map(s=>({...s,r:fixed(s.id)||pickFor(s.cat,series)})).filter(s=>s.r);
  const used=new Set(steps.map(s=>s.r.p.id));
  const weekly=RT.weekly.map(s=>({...s,r:fixed(s.id)||pickFor(s.cat,series,used)})).filter(s=>s.r);
  ROUTINE_IDS=new Set([...steps,...weekly].map(s=>s.r.p.id));
  const row=(label,meta,s)=>{const p=s.r.p,S=SERIES[p.s];return `<button class="rs" data-id="${p.id}">${sw(S,p)}<span class="rs-t">
    <span class="rs-no">${label}<span class="rs-time">${meta}</span></span>
    <b>${esc(p.name)}${badgeOf(p.id)}</b>
    <span class="rs-why">${esc(s.why||p.desc)}${s.r.fb?"（此系列沒有這一步，搭配溫和的基礎品項）":""}</span>
    <span class="rs-how">${p.how}</span><em class="tapx">點我看詳情 ›</em></span></button>`};
  return `<div class="rt"><div class="rt-head"><h3>你的推薦保養順序</h3><p>${esc(keys.map(k=>RT.notes[k]||"").join(""))}點產品可看詳細介紹。</p></div>
    <div class="rs-list">${steps.map((s,i)=>row(`STEP ${i+1}・${esc(s.name)}`,esc(s.time),s)).join("")}</div>
    ${weekly.length?`<div class="rt-sub">每週加強</div><div class="rs-list">${weekly.map(s=>row(esc(s.name),esc(s.freq),s)).join("")}</div>`:""}
    ${RT.footer?`<p class="note">${esc(RT.footer)}</p>`:""}</div>`;
}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-cat]");
  if(o){const c=CATS.find(x=>x.k===o.dataset.cat);st.cat=o.dataset.cat;st.cons=[];st.step=c&&c.skip?3:2;render();return}
  const n=e.target.closest("[data-con]");
  if(n){const k=n.dataset.con;if(k==="none"){st.cons=[];st.step=3;render();$("quiz").scrollIntoView({block:"start",behavior:"smooth"});return}st.cons=st.cons.includes(k)?st.cons.filter(x=>x!==k):[...st.cons,k];render();return}
  const g=e.target.closest("[data-go]");
  if(g){const v=g.dataset.go;
    if(v==="result"){if(!st.cons.length)return;st.step=3}
    else if(v==="all"){st.cat=null;st.cons=[];st.step=3}
    else if(v==="restart"){st.step=1;st.cat=null;st.cons=[]}
    else if(v==="back"){const c=CATS.find(x=>x.k===st.cat);st.step=(st.step===3&&st.cat&&!(c&&c.skip))?2:1}
    render();$("quiz").scrollIntoView({block:v==="result"?"start":"nearest",behavior:"smooth"});return}
  const d=e.target.closest("[data-id]");if(d){openSheet(+d.dataset.id);return}
  if(e.target.id==="x"||e.target.id==="scrim")closeSheet();
});

function runSearch(){
  const raw=$("q").value.trim(), box=$("qres"); $("qClear").hidden=!raw;
  if(!raw){box.hidden=true;box.innerHTML="";return}
  const toks=raw.split(/\s+/).map(norm).filter(Boolean);
  const res=P.filter(p=>p.name).map(p=>{const S=SERIES[p.s]||{},al=aliasesOf(p.id);
    const hay=norm([p.name,S.name,S.en,p.cats.map(c=>CATNAME[c]).join(""),p.size,p.desc,al.join(" "),"no"+p.id].join(" "));
    if(!toks.every(t=>hay.includes(t)))return null;
    const n=norm(p.name+al.join(""));const score=toks.reduce((a,t)=>a+(n.includes(t)?0:1),0);
    return {p,S,al,score}}).filter(Boolean).sort((a,b)=>a.score-b.score||a.p.id-b.p.id);
  const show=res.slice(0,8);
  box.innerHTML=res.length?`<p class="sres-h">找到 ${res.length} 項產品${res.length>8?"，顯示前 8 項":""}</p>${show.map(({p,S,al})=>`<button type="button" class="sitem" data-id="${p.id}">${sw(S,p)}<span class="txt"><b>${esc(p.name)}${badgeOf(p.id)}</b><span class="s">${esc(S.name||"")}・${p.cats.map(c=>CATNAME[c]).join("、")||"未分類"}・${esc(p.size)}</span>${al.length&&!al.includes(p.name)?`<span class="s">也叫：${esc([...new Set(al)].join("、"))}</span>`:""}</span><em class="tapx">點我看詳情 ›</em></button>`).join("")}`
    :`<p class="sres-h">找不到「${esc(raw)}」相關的產品，換個關鍵字試試，例如系列名稱或「面霜」「防曬」。</p>`;
  box.hidden=false;
  clearTimeout(qTimer);qTimer=setTimeout(()=>{try{if(typeof gaEvent==="function")gaEvent("search",{search_term:raw,results:res.length})}catch(e){}},1200);
}

function scheduleSave(){ if(!myRef)return; dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,800); }
async function flush(){
  if(writing||!dirty||!myRef)return;
  writing=true; dirty=false;
  const list=mySessions.filter(s=>s.id!==sess.id).concat([sess]).slice(-60);
  try{await myRef.set({sessions:list,updated:Date.now()}); mySessions=list}
  catch(e){if(e&&e.code==="invalid_argument")myRef=null; else dirty=true}

let CELEBRATED=false;
function celebrate(){
  try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(e){}
  const cv=document.createElement("canvas"); cv.setAttribute("aria-hidden","true");
  cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30";
  document.body.appendChild(cv);
  const ctx=cv.getContext("2d"), dpr=Math.min(2,window.devicePixelRatio||1);
  let W,H; const size=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}; size(); addEventListener("resize",size);
  const COLORS=["#c4203d","#e8546f","#f6b4c2","#7c1328","#ffffff","#f3d36b","#5d7a3b"];
  const parts=[], r=(a,b)=>a+Math.random()*(b-a);
  const add=(x,y,ang,spd,n)=>{for(let i=0;i<n;i++){const a=ang+r(-.45,.45),v=spd*r(.55,1.1);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,rot:r(0,6.28),vr:r(-.25,.25),w:r(6,11),h:r(4,8),c:COLORS[i%COLORS.length],shape:Math.random()<.18?"cherry":Math.random()<.5?"rect":"circle",life:0,tilt:r(0,6.28)})}};
  add(0,H*.85,-Math.PI/3,17,90); add(W,H*.85,-Math.PI*2/3,17,90);
  setTimeout(()=>{for(let i=0;i<70;i++)add(r(0,W),-20,Math.PI/2,r(2,4),1)},500);
  const drawCherry=(p)=>{ctx.strokeStyle="#5d7a3b";ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-9);ctx.quadraticCurveTo(-2,-3,-4,1);ctx.moveTo(0,-9);ctx.quadraticCurveTo(3,-3,4,2);ctx.stroke();
    ctx.fillStyle="#c4203d";ctx.beginPath();ctx.arc(-4,4,4,0,6.28);ctx.arc(4.5,5,4,0,6.28);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.7)";ctx.beginPath();ctx.arc(-5.5,2.5,1.1,0,6.28);ctx.fill()};
  const t0=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){p.vy+=.32;p.vx*=.985;p.vy*=.985;if(p.vy>4.5)p.vy=4.5;p.x+=p.vx+Math.sin(p.tilt+=.08)*.6;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      if(p.shape==="cherry")drawCherry(p);
      else{ctx.fillStyle=p.c;ctx.scale(1,Math.abs(Math.cos(p.tilt)));if(p.shape==="rect")ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);else{ctx.beginPath();ctx.arc(0,0,p.h/2,0,6.28);ctx.fill()}}
      ctx.restore()}
    if(t-t0<5200&&parts.some(p=>p.y<H+30))requestAnimationFrame(frame);
    else{removeEventListener("resize",size);cv.remove()}
  })(t0);
}

function shrinkImage(file,max=600){return new Promise((ok,no)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>b?ok({blob:b,data:c.toDataURL("image/jpeg",.82)}):no(new Error("encode")),"image/jpeg",.82)};
  im.onerror=()=>{URL.revokeObjectURL(url);no(new Error("decode"))};im.src=url})}

const sumObj=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
function renderStats(){
  if(!$("adSub"))return;
  const all=[]; ADOCS.forEach(d=>{const s=(d.data()||{}).sessions; if(Array.isArray(s))s.forEach(x=>x&&all.push(x))});
  $("adSub").textContent=`最後更新 ${new Date().toLocaleString("zh-TW",{hour12:false})}・資料即時同步`;
  const empty=!all.length; $("adEmpty").hidden=!empty; $("adBody").hidden=empty; if(empty)return;
  const started=all.filter(s=>s.step>0), done=all.filter(s=>s.done);
  const C={},I={}; all.forEach(s=>{for(const k in s.c||{})C[k]=(C[k]||0)+(+s.c[k]||0); for(const k in s.i||{})I[k]=(I[k]||0)+(+s.i[k]||0)});
  const totC=sumObj(C), totI=sumObj(I), ig=all.reduce((a,s)=>a+(+s.ig||0),0), gbc=all.reduce((a,s)=>a+(+s.gb||0),0);
  const clickers=done.filter(s=>sumObj(s.c)>0).length;
  let evNote="未設定團購";
  if(GB&&GB.start&&GB.end){evNote=`團購期間 ${all.filter(s=>s.t>=GB.start&&s.t<=GB.end).length} 次造訪`}
  const k=(l,v,sub,hl)=>`<div class="kpi${hl?" hl":""}"><span>${l}</span><b>${v}</b><small>${sub}</small></div>`;
  $("kpis").innerHTML=k("造訪人數",ADOCS.length,"不重複帳號")+k("造訪次數",all.length,evNote)+k("開始作答",started.length,`${Math.round(started.length/all.length*100)}% 的造訪`)
    +k("看到推薦",done.length,`完成率 ${started.length?Math.round(done.length/started.length*100):0}%`,true)
    +k("產品點擊",totC,`點擊率 ${totI?(totC/totI*100).toFixed(1):0}%・${done.length?Math.round(clickers/done.length*100):0}% 有點產品`,true)
    +k("IG＋團購點擊",ig+gbc,`IG ${ig}・團購 ${gbc}`);
  bars($("funnel"),[["進入網頁",all.length],["選了類別",all.filter(s=>s.step>=1).length],["選了困擾",all.filter(s=>s.step>=2).length],["看到推薦",done.length],["點開產品",all.filter(s=>sumObj(s.c)>0).length]],{green:true});
  // 近 14 天
  const days=[]; const now=new Date(); now.setHours(0,0,0,0);
  for(let d=13;d>=0;d--)days.push({t:now.getTime()-d*864e5,v:0,c:0});
  all.forEach(s=>{const i=Math.floor((s.t-days[0].t)/864e5); if(i>=0&&i<14){days[i].v++; if(s.done)days[i].c++}});
  const W=560,H=180,PD=28,max=Math.max(1,...days.map(d=>d.v)),bw=(W-PD-8)/14,step=max<=4?1:Math.ceil(max/4),ticks=[];
  for(let y=0;y<=max;y+=step)ticks.push(y);
  const yy=v=>H-22-(v/max)*(H-40), lab=t=>`${new Date(t).getMonth()+1}/${new Date(t).getDate()}`;
  $("trend").innerHTML=`<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 14 天造訪與看到推薦次數">
    ${ticks.map(t=>`<line x1="${PD}" x2="${W-4}" y1="${yy(t)}" y2="${yy(t)}" stroke="var(--line)"/><text x="${PD-6}" y="${yy(t)+4}" text-anchor="end" font-size="10" fill="var(--sub)">${t}</text>`).join("")}
    ${days.map((d,n)=>{const x=PD+4+n*bw;return `<rect x="${x}" y="${yy(d.v)}" width="${bw*.42}" height="${H-22-yy(d.v)}" rx="2" fill="var(--rose-soft)" stroke="var(--rose)" stroke-width=".6"><title>${lab(d.t)} 造訪 ${d.v}</title></rect>
      <rect x="${x+bw*.46}" y="${yy(d.c)}" width="${bw*.42}" height="${H-22-yy(d.c)}" rx="2" fill="var(--rose)"><title>${lab(d.t)} 看到推薦 ${d.c}</title></rect>
      ${n%2===0?`<text x="${x+bw*.44}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--sub)">${lab(d.t)}</text>`:""}`}).join("")}</svg>
    <div class="legend"><span><i style="background:var(--rose-soft);border:1px solid var(--rose)"></i>造訪</span><span><i style="background:var(--rose)"></i>看到推薦</span></div>`;
  const cnt=(fn)=>{const m={};all.forEach(s=>{const v=fn(s);if(v)m[v]=(m[v]||0)+1});return m};
  const cc=cnt(s=>s.cat); bars($("dCat"),Object.keys(CATLABEL).map(k=>[CATLABEL[k],cc[k]||0]).filter(e=>e[1]||CATS.some(c=>c.k===e[0])).sort((a,b)=>b[1]-a[1]));
  const cn={};all.forEach(s=>{(Array.isArray(s.con)?s.con:s.con?[s.con]:[]).forEach(k=>cn[k]=(cn[k]||0)+1)}); bars($("dCon"),CONCERNS.map(c=>[c.name,cn[c.k]||0]));
  const bySer={}; for(const id in C){const p=P.find(x=>x.id===+id); if(p)bySer[p.s]=(bySer[p.s]||0)+C[id]}
  bars($("dSer"),Object.keys(SERIES).map(k=>[SERIES[k].name,bySer[k]||0,SERIES[k].t1]).sort((a,b)=>b[1]-a[1]));
  bars($("dLink"),[[`${KOL.name} IG`,ig],["團購連結",gbc]],{noPct:true});
  // 產品排行
  const rows=P.filter(p=>p.cats.length).map(p=>{const c=C[p.id]||0,i=I[p.id]||0;return {p,c,i,r:i?c/i:0}});
  rows.sort((a,b)=>sortKey==="id"?a.p.id-b.p.id:(b[sortKey]-a[sortKey])||a.p.id-b.p.id);
  const maxC=Math.max(1,...rows.map(r=>r.c));
  const th=(key,l,n)=>`<th class="${n?"n":""}"><button data-sort="${key}" aria-pressed="${sortKey===key}">${l}</button></th>`;
  $("ptable").innerHTML=`<table><thead><tr>${th("id","產品")}<th>系列</th>${th("i","曝光",1)}${th("c","點擊",1)}${th("r","點擊率",1)}<th>點擊占比</th></tr></thead><tbody>
    ${rows.map(r=>{const S=SERIES[r.p.s];return `<tr><td>No.${pad(r.p.id)} ${esc(r.p.name)}${badgeOf(r.p.id)}</td>
      <td style="white-space:nowrap"><span class="hb" style="display:inline;margin:0"><label style="display:inline-flex"><i style="background:${S.t1}"></i>${S.name}</label></span></td>
      <td class="n">${r.i}</td><td class="n">${r.c}</td><td class="n">${r.i?(r.r*100).toFixed(1)+"%":"—"}</td>
      <td><div class="meter"><i style="width:${r.c/maxC*100}%"></i></div></td></tr>`}).join("")}</tbody></table>`;
  // 最近紀錄
  $("recent").innerHTML=all.slice().sort((a,b)=>b.t-a.t).slice(0,30).map(s=>{
    const prods=Object.keys(s.c||{}).map(id=>"No."+pad(id)).join("、");
    const links=[s.ig?`IG×${s.ig}`:"",s.gb?`團購×${s.gb}`:""].filter(Boolean).join("、");
    return `<tr><td>${new Date(s.t).toLocaleString("zh-TW",{hour12:false,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td>
      <td><span class="st${s.done?" ok":""}">${s.done?"看到推薦":s.step?`答到第 ${s.step} 題`:"只瀏覽"}</span></td>
      <td>${esc(CATLABEL[s.cat]||"—")}</td><td>${esc((Array.isArray(s.con)?s.con:s.con?[s.con]:[]).map(k=>CONLABEL[k]).filter(Boolean).join("、")||"—")}</td><td>${esc(prods||"—")}</td><td>${esc(links||"—")}</td></tr>`}).join("");
}

  adUnsub=DB.collection("clicks").limit(1000).onSnapshot(snap=>{ADOCS=snap.docs;renderStats()},()=>{if($("adSub"))$("adSub").textContent="讀取失敗，請重新整理頁面。";adUnsub=null});

/* 把團購設定寫進頁面本身，讓未登入的訪客也看得到 */
const SKEL_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
async function publishEmbed(over){
  const art=await claude.use("artifact"); if(!art)throw {code:"not_granted"};
  const res=await fetch("src.html",{cache:"no-store"}); if(!res.ok)throw {code:"no_src"};
  let src=await res.text();
  const vals={GB:("gb" in over)?over.gb:(GB&&GB.start?GB:null),KOL:("kol" in over)?over.kol:{blocks:blocksList(),buy:(KOLCFG&&KOLCFG.buy)||{},products:P,series:(KOLCFG&&KOLCFG.series)||{},routine:RT}};
  for(const k of ["GB","KOL"]){
    const mk="/*"+k+"*"+"/";
    const re=new RegExp("\\/\\*"+k+"\\*\\/[\\s\\S]*?\\/\\*"+k+"\\*\\/");
    if(!re.test(src))throw {code:"no_marker"};
    const json=JSON.stringify(vals[k]).replace(/</g,"\\u003c");
    src=src.replace(re,()=>mk+json+mk);
  }
  await art.publish(SKEL_HEAD+src+"</body></html>");
}
async function saveGB(data,okMsg){
  const m=$("gbMsg"); m.className="status"; m.textContent="儲存中…";
  try{await DB.doc("site/groupbuy").set({...data,at:Date.now()})}
  catch(err){m.className="status err";m.textContent="儲存失敗："+(err&&err.code==="invalid_argument"?"你的帳號沒有編輯權限。":"請稍後再試一次。");return}
  m.textContent=okMsg+" 正在同步給未登入的訪客…";
  try{sessionStorage.setItem("samu-admin","1")}catch(e){}
  try{await publishEmbed({gb:data.start?data:null})}
  catch(err){if(err&&err.code==="conflict")return;
    m.className="status err";m.textContent=okMsg+" 但未登入訪客的版本沒有同步成功（"+(err&&err.code||"unknown")+"），請稍後再按一次儲存。"}
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="gbForm")return; e.preventDefault();
  const m=$("gbMsg"); m.className="status";
  const v=id=>$(id).value.trim();
  const start=v("gb-start")?new Date(v("gb-start")+"T00:00:00").getTime():NaN, end=v("gb-end")?new Date(v("gb-end")+"T23:59:59").getTime():NaN, link=v("gb-link");
  if(!start||!end){m.className="status err";m.textContent="請填入開團與結團日期。";return}
  if(end<=start){m.className="status err";m.textContent="結團日期不能早於開團日期。";return}
  if(link&&!/^https:\/\//i.test(link)){m.className="status err";m.textContent="團購連結請以 https:// 開頭。";return}
  const products=v("gb-products").split(/[,，\s]+/).map(Number).filter(n=>P.some(p=>p.id===n&&p.cats.length));
  saveGB({title:v("gb-title"),start,end,link,note:v("gb-note"),products},"已儲存，登入的訪客已看到更新。");
});

(async()=>{
  renderGB();renderKol();
  if(!window.claude||!claude.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  DB=db; if(!DB)return;
  DB.doc("site/kol").onSnapshot(s=>{if(s.exists){const d=s.data();KOLCFG=d;applyCatalog(d);applyRoutine(d);syncPicked();renderBlocks();if(st.step===3)_render()}},()=>{});
  DB.doc("site/groupbuy").onSnapshot(s=>{GB=s.exists?s.data():null;renderGB();renderKol();if(!$("admin").hidden&&!document.activeElement?.closest("#gbForm"))fillForm();if(!$("admin").hidden)renderStats()},()=>{});
  if(!user)return;
  IS_ADMIN=await user.canEdit().catch(()=>false);
  if(IS_ADMIN){$("brandR").innerHTML=`<button class="adm-btn" id="admToggle">管理後台</button>`; let back=false;try{back=sessionStorage.getItem("samu-admin")==="1";sessionStorage.removeItem("samu-admin")}catch(e){} if(location.hash==="#admin"||back)showAdmin(true); return}
  const w=await user.can("data.write").catch(()=>null);
  UID=await user.id().catch(()=>null);

  myRef=ref; dirty=true; flush();
})();
